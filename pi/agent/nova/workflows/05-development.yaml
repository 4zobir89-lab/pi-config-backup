version: 1
id: nova-development
name: Development
trigger:
  event: DESIGN_READY
  idempotency_key: eventId
execution:
  mode: event-driven
  approval_required: false
agents:
  - orchestrator
  - frontend
  - backend
  - database
outputs:
  - components.tsx
  - services.ts
  - tests.md
success_event: CODE_READY
failure_events:
  - TEST_FAILED
  - FIX_REQUIRED
security:
  audit_log: required
  secret_access: reference-only
