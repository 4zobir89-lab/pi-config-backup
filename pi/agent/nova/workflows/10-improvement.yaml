version: 1
id: nova-improvement
name: Continuous Improvement
trigger:
  event: PROJECT_COMPLETED
  idempotency_key: eventId
execution:
  mode: event-driven
  approval_required: false
agents:
  - orchestrator
  - improvement
outputs:
  - growth-log.md
  - adr.md
success_event: PROJECT_COMPLETED
failure_events:
  - TEST_FAILED
  - FIX_REQUIRED
security:
  audit_log: required
  secret_access: reference-only
