version: 1
id: nova-security
name: Security Review
trigger:
  event: CODE_READY
  idempotency_key: eventId
execution:
  mode: event-driven
  approval_required: false
agents:
  - orchestrator
  - security
outputs:
  - security-review.md
success_event: DEPLOY_READY
failure_events:
  - TEST_FAILED
  - FIX_REQUIRED
security:
  audit_log: required
  secret_access: reference-only
