version: 1
id: nova-architecture
name: Architecture
trigger:
  event: REQUIREMENTS_READY
  idempotency_key: eventId
execution:
  mode: event-driven
  approval_required: false
agents:
  - orchestrator
  - architect
  - database
outputs:
  - architecture.md
  - api.yaml
  - database.sql
success_event: DESIGN_READY
failure_events:
  - TEST_FAILED
  - FIX_REQUIRED
security:
  audit_log: required
  secret_access: reference-only
